# Two-node Nebraska distributed-mode PoC
#
# Topology:
#   - postgres-control  (host port 5500) + nebraska-control (host port 9000)
#   - postgres-edge     (host port 5501) + nebraska-edge    (host port 9101)
#
# Both postgres instances run with wal_level=logical to support a logical
# replication subscription from edge -> control on the admin tables only.
# The new group_local table and other node-local tables (instance,
# instance_application, event, activity, instance_stats, instance_status_history)
# are NOT replicated; each node owns its own runtime state.
#
# Bring up the stack:
#   docker compose -f .repl-poc/docker-compose.yaml up -d
# Then configure replication:
#   ./.repl-poc/setup-replication.sh

services:
  postgres-control:
    image: postgres:17
    container_name: nebraska-pg-control
    ports:
      - "127.0.0.1:5500:5432"
    environment:
      POSTGRES_PASSWORD: nebraska
      POSTGRES_DB: nebraska
      POSTGRES_USER: postgres
      TZ: UTC
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  nebraska-control:
    image: nebraska:dev-runtime-overrides
    container_name: nebraska-control
    ports:
      - "127.0.0.1:9000:8000"
    depends_on:
      postgres-control:
        condition: service_healthy
    restart: always
    environment:
      NEBRASKA_DB_URL: "postgres://postgres:nebraska@postgres-control:5432/nebraska?sslmode=disable&connect_timeout=10"
    command:
      - /nebraska/nebraska
      - --auth-mode=noop
      - --http-static-dir=/nebraska/static
      - --api-endpoint-suffix=/

  postgres-edge:
    image: postgres:17
    container_name: nebraska-pg-edge
    ports:
      - "127.0.0.1:5501:5432"
    environment:
      POSTGRES_PASSWORD: nebraska
      POSTGRES_DB: nebraska
      POSTGRES_USER: postgres
      TZ: UTC
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  nebraska-edge:
    image: nebraska:dev-runtime-overrides
    container_name: nebraska-edge
    ports:
      - "127.0.0.1:9101:8000"
    depends_on:
      postgres-edge:
        condition: service_healthy
    restart: always
    environment:
      NEBRASKA_DB_URL: "postgres://postgres:nebraska@postgres-edge:5432/nebraska?sslmode=disable&connect_timeout=10"
    command:
      - /nebraska/nebraska
      - --auth-mode=noop
      - --http-static-dir=/nebraska/static
      - --api-endpoint-suffix=/

networks:
  default:
    name: nebraska-repl-poc
